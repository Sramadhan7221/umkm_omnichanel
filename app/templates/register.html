<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Daftar Owner | UMKM Omnichannel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/static/images/favicon.ico">

    <script src="/static/js/config.js"></script>
    <link href="/static/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/static/css/icons.min.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f6f8;
        }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h4 class="mt-3 mb-1">Daftar sebagai Owner</h4>
                    <p class="text-muted">Bisnis Anda akan aktif setelah disetujui Superadmin</p>
                </div>

                <div id="register-error" class="alert alert-danger d-none" role="alert"></div>
                <div id="register-success" class="alert alert-success d-none" role="alert"></div>

                <form id="form-register">
                    <div class="mb-3">
                        <label class="form-label">Nama Bisnis</label>
                        <input type="text" class="form-control" id="register-business-name" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="register-email" autocomplete="username" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kata Sandi</label>
                        <input type="password" class="form-control" id="register-password" minlength="8" autocomplete="new-password" required />
                        <div class="form-text">Minimal 8 karakter.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-register">
                        <i class="ri-user-add-line align-middle"></i> Daftar
                    </button>
                </form>

                <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.9rem;">
                    Sudah punya akun? <a href="/login">Masuk</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/static/js/vendor.min.js"></script>
    <script>
        (function () {
            "use strict";

            function showError(message) {
                var el = document.getElementById("register-error");
                el.textContent = message;
                el.classList.remove("d-none");
            }

            function hideError() {
                document.getElementById("register-error").classList.add("d-none");
            }

            document.getElementById("form-register").addEventListener("submit", function (e) {
                e.preventDefault();
                hideError();

                var businessName = document.getElementById("register-business-name").value.trim();
                var email = document.getElementById("register-email").value.trim();
                var password = document.getElementById("register-password").value;
                var btn = document.getElementById("btn-register");

                btn.disabled = true;
                fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password, business_name: businessName }),
                })
                    .then(function (res) {
                        if (!res.ok) {
                            return res.json().then(function (data) {
                                throw new Error(data.detail || "Registrasi gagal");
                            });
                        }
                        document.getElementById("form-register").classList.add("d-none");
                        var success = document.getElementById("register-success");
                        success.textContent = "Registrasi terkirim. Akun Anda akan aktif setelah disetujui Superadmin.";
                        success.classList.remove("d-none");
                    })
                    .catch(function (err) {
                        showError(err.message);
                        btn.disabled = false;
                    });
            });
        })();
    </script>
</body>

</html>
