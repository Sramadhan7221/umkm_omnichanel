<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Terjadi Kesalahan | UMKM Omnichannel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/static/images/favicon.ico">

    <script src="/static/js/config.js"></script>
    <link href="/static/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/static/css/icons.min.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f6f8;
        }
        .error-card { max-width: 560px; width: 100%; }
        .error-illustration { width: 220px; max-width: 60%; margin: 0 auto; }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5 text-center">

                <svg class="error-illustration" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi kesalahan server">
                    <ellipse cx="120" cy="178" rx="80" ry="10" fill="#e9ecef" />

                    <circle cx="120" cy="92" r="80" fill="#fdeeee" />

                    <g transform="translate(120,90)">
                        <rect x="-50" y="-55" width="100" height="82" rx="12" fill="var(--bs-danger, #f46a6a)" />
                        <circle cx="0" cy="-14" r="6" fill="#fff" />
                        <line x1="0" y1="8" x2="0" y2="30" stroke="#fff" stroke-width="8" stroke-linecap="round" />
                        <circle cx="0" cy="44" r="5" fill="#fff" />
                    </g>

                    <circle cx="34" cy="46" r="5" fill="#ffc35a" />
                    <circle cx="204" cy="60" r="4" fill="var(--bs-danger, #f46a6a)" opacity="0.5" />
                    <circle cx="196" cy="150" r="6" fill="#ffc35a" opacity="0.7" />
                    <circle cx="26" cy="140" r="4" fill="var(--bs-danger, #f46a6a)" opacity="0.4" />
                </svg>

                <h1 class="display-5 fw-bold text-danger mt-4 mb-1">500</h1>
                <h4 class="mb-2">Terjadi Kesalahan pada Server</h4>
                <p class="text-muted mb-1">Maaf, ada masalah teknis di sisi kami saat memproses permintaan Anda.</p>
                <p class="text-muted mb-4">Tim kami sudah mencatat kejadian ini. Silakan coba lagi beberapa saat lagi.</p>

                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="/" class="btn btn-primary">
                        <i class="ri-home-4-line align-middle"></i> Kembali ke Beranda
                    </a>
                    <a href="#" id="btn-logout" class="btn btn-outline-secondary">
                        <i class="ri-logout-box-line align-middle"></i> Keluar &amp; Ganti Akun
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/vendor.min.js"></script>
    <script>
        document.getElementById("btn-logout").addEventListener("click", function (e) {
            e.preventDefault();
            fetch("/api/auth/logout", { method: "POST" }).then(function () {
                window.location.href = "/login";
            });
        });
    </script>
</body>

</html>
