<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Reset Kata Sandi | UMKM Omnichannel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/static/images/favicon.ico">

    <script src="/static/js/config.js"></script>
    <link href="/static/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/static/css/icons.min.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f6f8;
        }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h4 class="mt-3 mb-1">Reset Kata Sandi</h4>
                    <p class="text-muted">Masukkan kata sandi baru untuk akun Anda.</p>
                </div>

                <div id="reset-error" class="alert alert-danger d-none" role="alert"></div>
                <div id="reset-success" class="alert alert-success d-none" role="alert"></div>

                <form id="form-reset">
                    <div class="mb-3">
                        <label class="form-label">Kata Sandi Baru</label>
                        <input type="password" class="form-control" id="reset-password" minlength="8" autocomplete="new-password" required />
                        <div class="form-text">Minimal 8 karakter.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-reset">
                        <i class="ri-lock-password-line align-middle"></i> Reset Kata Sandi
                    </button>
                </form>

                <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.9rem;">
                    <a href="/login">Kembali ke halaman Masuk</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/static/js/vendor.min.js"></script>
    <script>
        (function () {
            "use strict";

            function showError(message) {
                var el = document.getElementById("reset-error");
                el.textContent = message;
                el.classList.remove("d-none");
            }

            var token = new URLSearchParams(window.location.search).get("token");
            if (!token) {
                showError("Link reset tidak valid — token tidak ditemukan.");
                document.getElementById("form-reset").classList.add("d-none");
            }

            document.getElementById("form-reset").addEventListener("submit", function (e) {
                e.preventDefault();

                var password = document.getElementById("reset-password").value;
                var btn = document.getElementById("btn-reset");

                btn.disabled = true;
                fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token: token, password_baru: password }),
                })
                    .then(function (res) {
                        if (!res.ok) {
                            return res.json().then(function (data) {
                                throw new Error(data.detail || "Gagal reset kata sandi");
                            });
                        }
                        return res.json();
                    })
                    .then(function () {
                        document.getElementById("form-reset").classList.add("d-none");
                        var success = document.getElementById("reset-success");
                        success.textContent = "Kata sandi berhasil diubah. Silakan masuk dengan kata sandi baru.";
                        success.classList.remove("d-none");
                    })
                    .catch(function (err) {
                        showError(err.message);
                        btn.disabled = false;
                    });
            });
        })();
    </script>
</body>

</html>
