<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Masuk | UMKM Omnichannel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/static/images/favicon.ico">

    <script src="/static/js/config.js"></script>
    <link href="/static/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/static/css/icons.min.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f6f8;
        }
        .login-card { max-width: 400px; width: 100%; }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <!-- <img src="/static/images/logo.png" alt="logo" height="32"> -->
                    <h4 class="mt-3 mb-1">UMKM App</h4>
                    <p class="text-muted">Masuk untuk mengakses dashboard</p>
                </div>

                <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="login-email" placeholder="superadmin@umkmapp.com" autocomplete="username" />
                </div>
                <div class="mb-3">
                    <label class="form-label">Kata Sandi</label>
                    <input type="password" class="form-control" id="login-password" placeholder="Kata sandi" autocomplete="current-password" />
                </div>
                <button class="btn btn-primary w-100" id="btn-login">
                    <i class="ri-login-box-line align-middle"></i> Masuk
                </button>

                <!-- <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.85rem;">
                    Mode Demo &mdash; akun bawaan: <code>superadmin@umkmapp.com</code> / <code>Qwertyz!1</code>
                </p> -->
                <p id="login-info" class="text-muted text-center mt-3 mb-0 d-none" style="font-size: 0.9rem;"></p>
            </div>
        </div>
    </div>

    <script src="/static/js/vendor.min.js"></script>
    <script>
        (function () {
            "use strict";

            function showError(message) {
                var el = document.getElementById("login-error");
                el.textContent = message;
                el.classList.remove("d-none");
            }

            function doLogin() {
                var email = document.getElementById("login-email").value.trim();
                var password = document.getElementById("login-password").value;
                var btn = document.getElementById("btn-login");

                if (!email || !password) {
                    showError("Isi email dan kata sandi.");
                    return;
                }

                btn.disabled = true;
                fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password }),
                })
                    .then(function (res) {
                        if (!res.ok) {
                            return res.json().then(function (data) {
                                throw new Error(data.detail || "Login gagal");
                            });
                        }
                        return res.json();
                    })
                    .then(function (data) {
                        if (data.role === "owner") {
                            window.location.href = "/order_inbox";
                        } else if (data.role === "admin") {
                            window.location.href = "/pos";
                        } else {
                            // Superadmin has no business landing page yet
                            // (Epic J's dashboard isn't built this session).
                            var info = document.getElementById("login-info");
                            info.textContent = "Login berhasil sebagai Superadmin. Dashboard akan tersedia di sesi Epic J berikutnya.";
                            info.classList.remove("d-none");
                            btn.disabled = false;
                        }
                    })
                    .catch(function (err) {
                        showError(err.message);
                        btn.disabled = false;
                    });
            }

            document.getElementById("btn-login").addEventListener("click", doLogin);
            document.getElementById("login-password").addEventListener("keydown", function (e) {
                if (e.key === "Enter") doLogin();
            });
        })();
    </script>
</body>

</html>
