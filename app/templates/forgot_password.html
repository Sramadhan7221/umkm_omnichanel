<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <title>Lupa Kata Sandi | UMKM Omnichannel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/static/images/favicon.ico">

    <script src="/static/js/config.js"></script>
    <link href="/static/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />
    <link href="/static/css/icons.min.css" rel="stylesheet" type="text/css" />

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f5f6f8;
        }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h4 class="mt-3 mb-1">Lupa Kata Sandi</h4>
                    <p class="text-muted">Masukkan email akun Anda, kami kirim link reset.</p>
                </div>

                <div id="forgot-success" class="alert alert-success d-none" role="alert"></div>

                <form id="form-forgot">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="forgot-email" autocomplete="username" required />
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="btn-forgot">
                        <i class="ri-mail-send-line align-middle"></i> Kirim Link Reset
                    </button>
                </form>

                <p class="text-muted text-center mt-3 mb-0" style="font-size: 0.9rem;">
                    <a href="/login">Kembali ke halaman Masuk</a>
                </p>
            </div>
        </div>
    </div>

    <script src="/static/js/vendor.min.js"></script>
    <script>
        (function () {
            "use strict";

            document.getElementById("form-forgot").addEventListener("submit", function (e) {
                e.preventDefault();

                var email = document.getElementById("forgot-email").value.trim();
                var btn = document.getElementById("btn-forgot");

                btn.disabled = true;
                fetch("/api/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email }),
                })
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        document.getElementById("form-forgot").classList.add("d-none");
                        var success = document.getElementById("forgot-success");
                        success.textContent = data.message;
                        success.classList.remove("d-none");
                    })
                    .catch(function () {
                        btn.disabled = false;
                    });
            });
        })();
    </script>
</body>

</html>
