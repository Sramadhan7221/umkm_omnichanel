name: Test, Build & Deploy

on:
  push:
    branches: [main]

# Wajib eksplisit — supaya GITHUB_TOKEN bawaan Actions punya izin push image
# ke GHCR, terlepas dari setting default organisasi/repo.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/sramadhan7221/umkm_omnichanel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Tidak perlu service Postgres tambahan di runner ini — DATABASE_URL
      # sengaja tidak di-set, sehingga app/database.py otomatis jatuh ke
      # SQLite (mode dev/test), persis seperti menjalankan `pytest` lokal.
      - name: Run tests
        run: pytest

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd /opt/umkm-omni-web
            docker compose pull
            docker compose up -d
            docker image prune -f